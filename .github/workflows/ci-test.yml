#
# Test gate for the MCUHome firmware framework: a job per wrapper in
# scripts/test.d/, plus a pre-check that every wrapper has one or is
# declared skipped with a reason.
#
#   test-pytest  — the Python suite in tests/python/ (the fast half of
#                  the test strategy, docs/design/builder-pipeline.md
#                  section 9): model, compiler, the golden generator
#                  output, and the closure the SDK entry point is allowed
#                  to import. `-rs` keeps any skip loud in the log rather
#                  than a dot.
#
# The twister wrapper's job is NOT here, and the skip declaration below
# says where it is. It compiles the Zephyr suites in the build environment
# this commit produces — the workspace and tools packages ci-build.yml's
# build-packages job builds — and artifacts do not cross a workflow
# boundary within one run, so the job has to live beside the job that
# produces them. It is `test-twister` there, under the same name and with
# the same display name.
#
# skip-gate: twister: runs as the test-twister job of ci-build.yml, where the environment packages it compiles in are built
#
# --group needs pip >= 25.1; test-pytest upgrades pip in its fresh .venv
# before using it.
#
# All actions are pinned to commit SHAs, not tags.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-gates:
    name: Check gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: scripts/test check-ci
        run: scripts/test check-ci

  test-pytest:
    name: Test (pytest)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The two editable installs this repository publishes — the
      # workbench lives in mcu-home/mcuhome-workbench — and no aggregate
      # distribution over them (see the head comment of the root
      # pyproject.toml). The dev tools are a PEP 735 dependency group
      # (--group dev), which needs pip >= 25.1; upgrade first.
      - name: Create .venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check \
            -e ./packaging/model \
            -e ./packaging/compiler \
            --group dev

      - name: scripts/test pytest
        run: scripts/test pytest -rs
