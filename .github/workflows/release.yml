# The release act of this repository — one workflow, branching on the tag.
#
# THREE LINES OUT OF ONE HISTORY. The SDK package, the build workspace
# package and the build tools packages are versioned independently in
# `packaging/build-environment/environment.json`, and a tag says which of
# them it releases by its prefix:
#
#   v<version>            mcuhome-sdk
#   workspace-v<version>  mcuhome-build-workspace
#   tools-v<version>      mcuhome-build-tools_<os>-<arch>, both platforms
#
# No artifact takes another one's version. A release publishes exactly the
# line its tag names, and nothing else travels with it.
#
# WHAT "PUBLISHED" MEANS HERE: a GitHub release of this repository, and
# nothing else. The package registry is the users' source and is fed by
# hand by its operator, hours or days after a release — so nothing in this
# file asks it anything, and every version this workflow resolves comes off
# this repository's own releases and is handed to the workbench as a local
# package source. `RELEASING.md` says where the operator's step sits.
#
# THE JOBS, in the order a tag walks them:
#
#   gate-release       which line, which version, and what has to pass:
#                      the tag against environment.json, then the D10.9
#                      catalogue against PUBLISHED versions only. A line
#                      whose own requirement nothing published satisfies is
#                      blocked here, before anything is built.
#   build-packages     the tagged line's package(s) at the real version,
#                      built in the pinned packager from the tagged commit —
#                      plus, under a local `+gate.<sha>` version, a stand-in
#                      for any stage that has nothing published yet.
#   build-firmware     the reference Matter device, once per combination the
#                      gate named and per architecture, built the way a user
#                      builds one: `mcuhome device build`, subprocess
#                      profile, the packages as local sources. Red here and
#                      nothing is published — that is what `needs:` says.
#   publish-release    the GitHub release, carrying exactly the archives
#                      that were tested and their two sidecars.
#   build-environment-image / publish-environment-image-index
#                      a workspace release becomes an image: this archive
#                      plus the newest published tools its meta accepts,
#                      per architecture, and the index over the two.
#   verify-release     the same device in the CONTAINER profile against the
#                      image that was just pushed (by digest), or against
#                      the published image an SDK release resolves to.
#
# TWO DISPATCHES, and they are the only ways to run this by hand.
#
#   `rehearse: <tag>`  everything above except publishing: the gate, the
#                      packages, the firmware. It answers "would this tag
#                      go through" against any ref, and it creates no
#                      release, pushes no image and moves nothing.
#   `workspace_version` + `revision`
#                      an image revision -r<n> of an already published
#                      workspace release: a refreshed base, a Dockerfile
#                      change, or newly published tools that release
#                      accepts. Assembled from release assets, verified
#                      like any other image, and it publishes no package.
#
# Why zstandard is pinned: two parties building the same tag must reach the
# same sha256, because that hash is a hashed input of the build context ID.
# Everything else the scripts do is deterministic by construction; the
# compressor library is the one residual variable.
#
# All actions are pinned to commit SHAs, not tags.

name: Release

on:
  push:
    tags:
      - "v*"
      - "workspace-v*"
      - "tools-v*"
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Dry run: the tag to rehearse against this ref (e.g. workspace-v0.1.0). Publishes nothing."
        type: string
        default: ""
      workspace_version:
        description: "Image revision: the published build workspace version to assemble again"
        type: string
        default: ""
      revision:
        description: "Image revision: the -r<n> to publish (with workspace_version; counts from 1)"
        type: string
        default: ""

permissions:
  contents: read

env:
  ZSTANDARD_VERSION: "0.25.0"

jobs:
  # ------------------------------------------------------------------
  # What this run is about, and whether it may proceed at all.
  #
  # Three questions, in the order that makes the cheap refusals cheap:
  # which of the three ways this run was started, which line the tag names
  # and whether its version is the one the commit declares, and finally the
  # catalogue — which (SDK, workspace, tools) combinations have to build
  # before anything is published.
  #
  # The catalogue is `scripts/release_readiness.py`'s, the same one every
  # push writes, under the rule a tag lives by: only published versions
  # count. Where the line below the tagged one has nothing published that
  # satisfies what this one requires, the release is BLOCKED — a package
  # nobody can resolve a chain through is not a release, and finding that
  # out after the archives are uploaded is finding it out too late.
  gate-release:
    name: Gate (release)
    runs-on: ubuntu-latest
    outputs:
      # "tag", "rehearse" or "image" — what this run is.
      mode: ${{ steps.mode.outputs.mode }}
      tag: ${{ steps.mode.outputs.tag }}
      workspace_version: ${{ steps.mode.outputs.workspace_version }}
      revision: ${{ steps.mode.outputs.revision }}
      stage: ${{ steps.tag.outputs.stage }}
      version: ${{ steps.tag.outputs.version }}
      family: ${{ steps.tag.outputs.family }}
      packages: ${{ steps.gate.outputs.packages }}
      combinations: ${{ steps.gate.outputs.combinations }}
      verify_mode: ${{ steps.gate.outputs.verify_mode || steps.image.outputs.verify_mode }}
      verify_reason: ${{ steps.gate.outputs.verify_reason || steps.image.outputs.verify_reason }}
      verify_workspace_version: ${{ steps.gate.outputs.verify_workspace_version }}
      verify_combinations: ${{ steps.gate.outputs.verify_combinations }}
      # The tools release an image of this workspace delivers, and the SDK
      # a verification compiles. Resolved once, here, because both answers
      # come out of the published world and this is the job that reads it.
      tools_tag: ${{ steps.gate.outputs.tools_tag || steps.image.outputs.tools_tag }}
      sdk_tag: ${{ steps.image.outputs.sdk_tag }}
    steps:
      # The tagged commit, and its tags: the gate reads environment.json
      # out of the commit, never out of a working tree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Which of the three ways this run was started, decided once. The two
      # dispatch forms are mutually exclusive: one rehearses a tag and
      # builds, the other assembles an image from what is already published,
      # and a run that tried to be both would be a run nobody can read.
      - name: What kind of run is this
        id: mode
        env:
          REHEARSE: ${{ inputs.rehearse }}
          WORKSPACE_VERSION: ${{ inputs.workspace_version }}
          REVISION: ${{ inputs.revision }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            { echo "mode=tag"; echo "tag=$REF_NAME"; } >> "$GITHUB_OUTPUT"
            echo "::notice::releasing $REF_NAME"
            exit 0
          fi
          if [ -n "$REHEARSE" ] && [ -n "$WORKSPACE_VERSION" ]; then
            echo "::error::this dispatch asks for both a rehearsal of $REHEARSE and an image revision of $WORKSPACE_VERSION. They are different runs: rehearse a tag, or assemble an image — one per dispatch." >&2
            exit 1
          fi
          if [ -n "$REHEARSE" ]; then
            { echo "mode=rehearse"; echo "tag=$REHEARSE"; } >> "$GITHUB_OUTPUT"
            echo "::notice::rehearsing $REHEARSE against $REF_NAME — nothing will be published"
            exit 0
          fi
          if [ -z "$WORKSPACE_VERSION" ]; then
            echo "::error::this dispatch says nothing. Set 'rehearse' to a tag to try a release without publishing, or 'workspace_version' and 'revision' to assemble another image from a published build workspace release." >&2
            exit 1
          fi
          case "$REVISION" in
            ''|*[!0-9]*)
              echo "::error::the image revision is '$REVISION', and it counts assemblies from 1." >&2
              exit 1 ;;
          esac
          if [ "$REVISION" -lt 1 ]; then
            echo "::error::the image revision is $REVISION, and it counts assemblies from 1." >&2
            exit 1
          fi
          {
            echo "mode=image"
            echo "workspace_version=$WORKSPACE_VERSION"
            echo "revision=$REVISION"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::assembling build-environment:$WORKSPACE_VERSION-r$REVISION"

      - name: Set up Python
        if: steps.mode.outputs.mode != 'image'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install what the gate reads versions with
        if: steps.mode.outputs.mode != 'image'
        run: python -m pip install --disable-pip-version-check packaging

      # The cheapest refusal there is, and the most expensive one to miss:
      # the archives are named after the version the COMMIT declares, never
      # after the tag, so a tag on an unbumped commit would publish bytes
      # under a number that already means something else. A published
      # version is immutable and eternal.
      - name: The tag names the version this commit declares
        id: tag
        if: steps.mode.outputs.mode != 'image'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -o pipefail
          python scripts/release.py check-tag "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: What this release has to pass
        id: gate
        if: steps.mode.outputs.mode != 'image'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          python scripts/release.py \
            --repository-slug "$GITHUB_REPOSITORY" gate "$TAG" --output gate.json
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json

          plan = json.load(open("gate.json"))
          verify = plan.get("verify", {})
          for key, value in (
              ("packages", plan.get("packages", [])),
              ("combinations", plan.get("combinations", [])),
              # Never empty: a matrix cannot expand an empty list, and the
              # job that consumes this is turned off by verify_mode.
              ("verify_combinations", [
                  one for one in plan.get("combinations", [])
                  if one["id"] == verify.get("combination")
              ] or plan.get("combinations", [])[-1:]),
          ):
              print(f"{key}<<PLAN_EOF")
              print(json.dumps(value))
              print("PLAN_EOF")
          # Every combination of one gate resolves the same tools package;
          # it is what an image of this release would deliver.
          tools = {
              one["tools"].get("tag")
              for one in plan.get("combinations", [])
              if one["tools"]["source"] == "published"
          }
          print(f"tools_tag={tools.pop() if len(tools) == 1 else ''}")
          print(f"verify_mode={verify.get('mode', 'skip')}")
          print(f"verify_reason={verify.get('reason', '')}")
          print(f"verify_workspace_version={verify.get('workspace_version', '')}")
          PY

      - name: Say what it demands
        if: steps.mode.outputs.mode != 'image'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import os

          plan = json.load(open("gate.json"))
          released = plan["release"]
          labels = {one["id"]: one["label"] for one in plan["combinations"]}
          rehearsal = os.environ["MODE"] == "rehearse"
          headings = {
              "down": "What this release promises: the versions it requires",
              "up": "What already requires this line",
          }
          print(f"## {'Rehearsing' if rehearsal else 'Releasing'} {released['tag']}")
          for direction, rows in plan["catalogue"].items():
              print()
              print(f"### {headings.get(direction, direction)}")
              print()
              print(plan["verdicts"].get(direction, ""))
              print()
              print("| tried against | combination | note |")
              print("|---|---|---|")
              for row in rows:
                  combination = labels.get(row["combination"], row["combination"] or "—")
                  print(f"| {row['subject']} | {combination} | {row['note'] or ''} |")
          print()
          if rehearsal:
              print("Nothing is published by a rehearsal.")
          PY

      # An image revision names a published workspace release and nothing
      # else. What it delivers, and what a verification afterwards compiles,
      # both follow from that release's own meta file.
      - name: What this revision assembles
        id: image
        if: steps.mode.outputs.mode == 'image'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE_VERSION: ${{ steps.mode.outputs.workspace_version }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check packaging
          python scripts/release.py --repository-slug "$GITHUB_REPOSITORY" \
            image-packages --workspace-version "$WORKSPACE_VERSION" > resolved.txt
          tee -a "$GITHUB_OUTPUT" < resolved.txt
          # An image can be assembled without an SDK; verifying it cannot —
          # the reference device is compiled FROM an SDK package, and a
          # workspace release no published SDK accepts has none to compile.
          if grep -q '^sdk_tag=.' resolved.txt; then
            echo "verify_mode=pushed-image" >> "$GITHUB_OUTPUT"
          else
            echo "verify_mode=skip" >> "$GITHUB_OUTPUT"
            echo "verify_reason=no published mcuhome-sdk accepts build workspace ${WORKSPACE_VERSION}, so there is no SDK package to build the reference device from" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the gate
        if: steps.mode.outputs.mode != 'image'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate
          path: gate.json
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # The packages this run builds.
  #
  # The tagged line's own, at the version the tag names and with NO local
  # suffix: those are the bytes `publish-release` uploads, and they are the
  # bytes the firmware below is built with — the same file, not a second
  # build of the same inputs.
  #
  # Plus a stand-in for any line that has nothing published to fill its
  # place, under a `+gate.<sha>` local version. A local version is the one
  # shape a package host refuses to publish, so a stand-in can never be
  # mistaken for a release, and `publish-release` names its assets
  # explicitly rather than uploading whatever it finds.
  #
  # The matrix comes from the gate, because which stages need building is a
  # property of the published world and not of this file.
  build-packages:
    name: Build (${{ matrix.stage }} package${{ matrix.platform && format(', {0}', matrix.platform) || '' }})
    needs: gate-release
    if: needs.gate-release.outputs.mode != 'image'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Pull only — the packager image is published by ci-build.yml.
      packages: read
    strategy:
      # A broken workspace package and a broken tools package are different
      # news, and one cancelling the other would hide the second.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate-release.outputs.packages) }}
    env:
      # Empty on purpose, and not pointless: the package scripts take the
      # archive's single mtime from SOURCE_DATE_EPOCH when it is set and
      # from the packaged commit's own committer date when it is not. The
      # commit is what should decide it, so nothing a runner image happens
      # to export may reach the script.
      SOURCE_DATE_EPOCH: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The package scripts read the commit, so its history has to be here.
          fetch-depth: 0

      # A matrix entry is a label, and a label is a promise somebody else
      # keeps. The tools package is named after an architecture and filled
      # with binaries for one; built on the wrong runner it would be a file
      # whose name lies, and nothing downstream could tell.
      - name: The runner is the architecture the matrix claims
        if: matrix.platform != ''
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) actual=linux-amd64 ;;
            aarch64) actual=linux-arm64 ;;
            *) actual="$(uname -m)" ;;
          esac
          test "$actual" = "$PLATFORM" || {
            echo "::error::this runner is $actual, not $PLATFORM" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the pinned compressor
        run: python -m pip install --disable-pip-version-check "zstandard==${ZSTANDARD_VERSION}"

      # The package refuses to be built when one of its binaries needs a
      # newer glibc than the host baseline — but only where objdump exists,
      # and it skips with a notice where it does not. A release artifact
      # must not be the one that skipped it.
      - name: objdump must be here, or the host baseline is not checked
        if: matrix.stage == 'tools'
        run: |
          set -euo pipefail
          command -v objdump || {
            echo "::error::no objdump on this runner — the package build would skip the glibc baseline check and ship a package nobody measured" >&2
            exit 1
          }

      # The workspace, the packager image and the archive are on this disk
      # at the same time and each of them is gigabytes. `rm -rf` on an
      # absent path is not an error, so the same list serves any runner
      # image.
      - name: Make room, and say how much there is
        if: matrix.stage != 'sdk'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # One module names the packager image, and this is it being asked. It
      # answers with the digest, never with the tag: a package laid out by
      # "whatever that tag points at today" is a package nobody can
      # reproduce.
      - name: Resolve the packager image reference
        if: matrix.stage != 'sdk'
        id: image
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from packager_image import reference

          print(f"reference={reference()}")
          PY

      - name: Log in to ghcr.io
        if: matrix.stage != 'sdk'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pulled, never built as a fallback: an image that is not published is
      # one nobody else can reproduce this package with, and a release
      # artifact laid out by it would be a package whose provenance stops at
      # this runner.
      - name: Pull the pinned packager image
        if: matrix.stage != 'sdk'
        run: |
          set -euo pipefail
          reference='${{ steps.image.outputs.reference }}'
          docker pull --quiet "$reference" || {
            echo "::error::$reference is not published — run the Build workflow on main first" >&2
            exit 1
          }

      # The released line gets the version environment.json declares and
      # nothing appended; a stand-in gets a local segment, which is exactly
      # the shape a package host will not publish — except the build
      # workspace, whose own declaration names the tools version it is
      # delivered with and whose version a container image is tagged after.
      # `scripts/release.py` decides which is which; this only reads it.
      - name: Build the package
        env:
          STAGE: ${{ matrix.stage }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIXED: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          suffix=()
          if [ "$SUFFIXED" = "true" ]; then
            suffix=(--version-suffix "gate.$(git rev-parse --short HEAD)")
          fi
          case "$STAGE" in
            sdk)
              python scripts/build_sdk_archive.py \
                --output-dir dist --revision HEAD "${suffix[@]}"
              ;;
            workspace)
              python scripts/build_env_package.py workspace \
                --output-dir dist --work-dir "$RUNNER_TEMP/package-work" "${suffix[@]}"
              ;;
            tools)
              python scripts/build_env_package.py tools \
                --output-dir dist --work-dir "$RUNNER_TEMP/package-work" \
                --os "${PLATFORM%%-*}" --arch "${PLATFORM##*-}" "${suffix[@]}"
              ;;
          esac
          df -h /

      - name: Show what was built
        run: |
          set -euo pipefail
          ls -l dist/
          cat dist/*.meta.json
          (cd dist && sha256sum -c ./*.sha256)

      # GitHub's documented ceiling for one release asset is 2 GiB, and it
      # does not refuse a larger one legibly — reported failures range from
      # a bare HTTP 500 to an empty asset. The workspace package is the one
      # that can grow into that wall, so the wall is named here rather than
      # discovered on a release evening.
      - name: The archive has to fit a release asset
        if: matrix.release == true
        run: |
          set -euo pipefail
          limit=$((2 * 1024 * 1024 * 1024))
          for archive in dist/*.tar.zst; do
            size="$(stat -c%s "$archive")"
            echo "$(basename "$archive")  $size bytes"
            test "$size" -lt "$limit" || {
              echo "::error::$(basename "$archive") is $size bytes and a GitHub release asset has to stay below 2 GiB — this package needs a carrier the release page is not" >&2
              exit 1
            }
          done

      # The archive, its checksum, its meta file and the index together: the
      # downloaded artifact is then already a package source directory the
      # workbench can be pointed at, rather than four things to reassemble.
      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # The gate's firmware builds: the reference Matter device, once per
  # combination and architecture, built the way a user builds one.
  #
  # This is the same walk `ci-build.yml`'s build-firmware does per commit —
  # `mcuhome device build`, the subprocess profile, the packages as local
  # sources — with one difference that is the point of a tag: the packages
  # are the ones that will be published, and the versions around them are
  # published releases rather than this commit's.
  #
  # A red leg here publishes nothing. That is not a policy this job
  # enforces; it is what `needs:` means.
  build-firmware:
    name: Build (firmware, ${{ matrix.combination.id }}, ${{ matrix.target.arch }})
    needs: [gate-release, build-packages]
    if: needs.gate-release.outputs.mode != 'image'
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        combination: ${{ fromJSON(needs.gate-release.outputs.combinations) }}
        # Both architectures, every time. The firmware is the same
        # cross-compiled ARM binary either way — what differs is the *host*
        # the toolchain runs on, and that is exactly what a build
        # environment is.
        target:
          - arch: amd64
            platform: linux-amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux-arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      # Pins the host-side ccache directory into the workspace so the cache
      # action has a path it can name.
      MCUHOME_CCACHE_DIR: ${{ github.workspace }}/.ccache
      PLATFORM: ${{ matrix.target.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcuhome-sdk

      # The `mcuhome` command is a thin shell in its own repository and this
      # job needs the command, not just the library. Public siblings, plain
      # checkouts.
      - name: Checkout the mcuhome command line
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-cli
          path: .deps/mcuhome-cli

      - name: Checkout the workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-workbench
          path: .deps/mcuhome-workbench

      # The workbench depends on the package registry's own reference
      # verifier, which publishes no distribution — so it is checked out at
      # the commit the workbench's own CI pins, and nowhere else is that
      # commit stated.
      - name: Checkout the package tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-packagetool
          ref: 7ce85fce47b89532dfa1585f0790e0820a1fbc71 # the ref mcuhome-workbench's ci-test.yml pins
          path: .deps/mcuhome-packagetool

      # 3.13 is not a preference: the tools package ships compiled wheels
      # built by the packager's interpreter, and the build's virtual
      # environment is created from them by the interpreter that runs this
      # job. A different minor would find no candidate for them.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Editable, and that is not a style preference:
      # mcuhome.compiler.workspace's installed_module_dir() resolves the
      # module directory from the package's own location, so a copy in
      # site-packages would take the Python half of the SDK into the build
      # and leave the Zephyr module behind.
      - name: Install the builder and its command line
        run: |
          python -m pip install --disable-pip-version-check \
            -e ./mcuhome-sdk/packaging/model \
            -e ./.deps/mcuhome-packagetool \
            -e ./.deps/mcuhome-workbench \
            -e ./mcuhome-sdk/packaging/compiler \
            -e ./.deps/mcuhome-cli
          # A build environment delivers an UNSIGNED image and the host
          # signs it afterwards — the private key never enters an
          # environment, so signing is a host duty and imgtool a host tool.
          python -m pip install --disable-pip-version-check imgtool==2.4.0

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # One directory per stage, and each holds exactly one version: the
      # chain then resolves to this combination without anything being
      # pinned in a device file.
      - name: Take the SDK package this run built
        if: matrix.combination.sdk.source != 'published'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages-sdk
          path: sources/sdk

      - name: Take the workspace package this run built
        if: matrix.combination.workspace.source != 'published'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages-workspace
          path: sources/workspace

      - name: Take the tools package this run built
        if: matrix.combination.tools.source != 'published'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages-tools-${{ matrix.target.platform }}
          path: sources/tools

      # A published stage comes off its GitHub release — the archive, its
      # checksum and its meta file — and gets the index.json a release page
      # does not carry, which is what makes the directory a package source
      # at all. No registry is asked: it is fed by hand, after this.
      - name: Take the published packages this combination names
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ matrix.combination.sdk.source == 'published' && matrix.combination.sdk.tag || '' }}
          WORKSPACE_TAG: ${{ matrix.combination.workspace.source == 'published' && matrix.combination.workspace.tag || '' }}
          TOOLS_TAG: ${{ matrix.combination.tools.source == 'published' && matrix.combination.tools.tag || '' }}
        run: |
          set -euo pipefail
          take() {
            tag="$1"; into="$2"; pattern="$3"
            [ -n "$tag" ] || return 0
            mkdir -p "$into"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$pattern" --pattern "$pattern.sha256" \
              --pattern "$pattern.meta.json" --dir "$into" --clobber
            python mcuhome-sdk/scripts/release_readiness.py sources "$into"
          }
          take "$SDK_TAG" sources/sdk 'mcuhome-sdk-*.tar.zst'
          take "$WORKSPACE_TAG" sources/workspace 'mcuhome-build-workspace-*.tar.zst'
          take "$TOOLS_TAG" sources/tools "mcuhome-build-tools_${PLATFORM}-*.tar.zst"

      - name: Say which packages this leg builds with
        run: |
          set -euo pipefail
          echo "::notice::${{ matrix.combination.label }}"
          for one in sources/*/index.json; do
            [ -f "$one" ] || continue
            echo "--- $one"
            cat "$one"
          done

      # Restored, never saved: a tag is rare and the entries this workflow
      # would write are the same ones `ci-build.yml` writes from main, with
      # the repository's cache budget spent twice for it.
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-matter-2-${{ runner.os }}-${{ matrix.target.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-matter-2-${{ runner.os }}-${{ matrix.target.arch }}-

      # A project of its own, with the device copied into it: a build writes
      # a signing key next to the device it signs, and the checkout is not a
      # place to write one. The key is the throwaway committed in this
      # repository — signing nothing that leaves a runner, never used for a
      # release — so that the legs of one run are comparable: MCUboot bakes
      # the signing *public* key into bootloader.hex, and a key each runner
      # invented would make that file differ for a reason that says nothing.
      # Copied out at mode 600 into a directory of its own, because MCUHome
      # refuses key material other users can read and a checked-out file is
      # 644 by definition.
      - name: Make a project for it
        run: |
          set -euo pipefail
          mkdir -p project
          cd project
          mcuhome project init
          mkdir -p devices
          cp ../mcuhome-sdk/docs/design/examples/00-bmp180-two-endpoints.yaml devices/
          install -d -m 700 "$RUNNER_TEMP/signing"
          install -m 600 ../mcuhome-sdk/.github/workflows/firmware-signing-key.pem \
            "$RUNNER_TEMP/signing/mcuboot.pem"

      # The documented invocation, and the whole point of this job. A
      # combination the gate marked as not required is one whose chain does
      # not hold together — built to see what a broken chain does, never a
      # reason to stop a release — so only a required leg reddens the run.
      - name: Build the reference Matter device
        id: build
        continue-on-error: ${{ !matrix.combination.required }}
        working-directory: project
        run: |
          set -euo pipefail
          mcuhome device build devices/00-bmp180-two-endpoints.yaml \
            --build-dir build/bmp180-node \
            --signing-key "$RUNNER_TEMP/signing/mcuboot.pem" \
            --build-target local --build-mode subprocess \
            --sdk-sources "$GITHUB_WORKSPACE/sources/sdk" \
            --sdk-sources "$GITHUB_WORKSPACE/sources/workspace" \
            --sdk-sources "$GITHUB_WORKSPACE/sources/tools"

      # A green build that produced nothing is worse than a red one.
      - name: Check the artifact set
        id: artifacts
        if: steps.build.outcome == 'success'
        continue-on-error: ${{ !matrix.combination.required }}
        run: python3 mcuhome-sdk/scripts/check_build_artifacts.py project/build/bmp180-node

      - name: What it produced
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          cd project/build/bmp180-node
          sha256sum -- firmware.bin firmware.hex bootloader.hex build-report.json

      - name: A combination that claims to work has to work
        if: >-
          matrix.combination.required
          && (steps.build.outcome != 'success' || steps.artifacts.outcome != 'success')
        env:
          LABEL: ${{ matrix.combination.label }}
          ARCH: ${{ matrix.target.arch }}
        run: |
          echo "::error::$LABEL did not build on $ARCH" >&2
          exit 1

      - name: A combination that claims nothing is reported, not failed
        if: >-
          !matrix.combination.required
          && (steps.build.outcome != 'success' || steps.artifacts.outcome != 'success')
        env:
          LABEL: ${{ matrix.combination.label }}
          ARCH: ${{ matrix.target.arch }}
          REASON: ${{ matrix.combination.reason }}
        run: |
          echo "::notice::$LABEL did not build on $ARCH, and nothing claimed it would: $REASON"

  # ------------------------------------------------------------------
  # The GitHub release, carrying exactly the archives that were tested.
  #
  # `needs:` is the gate: the packages and every firmware leg have to have
  # succeeded, and a rehearsal never gets here at all. The assets are named
  # by `scripts/release.py assets` rather than globbed — a stand-in package
  # for another line is in this run's artifacts too, and a release publishes
  # one line.
  #
  # index.json stays here, as it always has: it belongs to a source, and a
  # source is signed by the package host. What travels is the archive, its
  # checksum and its meta file — the three files the host's publish
  # pipeline reads, and it refuses a package that is missing either sidecar.
  publish-release:
    name: Publish (release)
    needs: [gate-release, build-packages, build-firmware]
    if: needs.gate-release.outputs.mode == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install what the asset list reads versions with
        run: python -m pip install --disable-pip-version-check packaging

      # Merged into one directory: the tools line has two artifacts, one per
      # platform, and they are two packages of one release.
      - name: Take the packages this run built for the tagged line
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: packages-${{ needs.gate-release.outputs.stage }}*
          path: dist
          merge-multiple: true

      - name: Exactly these files, and no others
        id: assets
        env:
          STAGE: ${{ needs.gate-release.outputs.stage }}
          VERSION: ${{ needs.gate-release.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/release.py assets "$STAGE" \
            --version "$VERSION" --directory dist | tee assets.txt
          echo "--- what is being published:"
          while IFS= read -r asset; do
            case "$asset" in
              *.tar.zst) sha256sum "$asset" ;;
            esac
          done < assets.txt

      # What the release page says about itself: the versions, what this
      # package requires of the next stage, the hash of the inputs it was
      # built from, and the hash of every byte that is attached. The meta
      # files are the source — the same documents the package host records
      # and a workbench resolves through.
      - name: Write the release notes
        env:
          STAGE: ${{ needs.gate-release.outputs.stage }}
          VERSION: ${{ needs.gate-release.outputs.version }}
          TAG: ${{ needs.gate-release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - > notes.md <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          stage = os.environ["STAGE"]
          version = os.environ["VERSION"]
          assets = [Path(line) for line in Path("assets.txt").read_text().split()]
          print(f"Release of the **{stage}** line: {version}.")
          print()
          for meta_path in sorted(one for one in assets if one.name.endswith(".meta.json")):
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              package = meta["package"]
              name = package["name"] + (
                  f"_{package['architecture']}" if package.get("architecture") else ""
              )
              print(f"### {name} {package['version']}")
              print()
              requires = meta.get("requires") or {}
              if requires:
                  print("Requires, and resolves to the newest published version satisfying it:")
                  print()
                  for key, value in sorted(requires.items()):
                      print(f"- `{key}` `{value}`")
              else:
                  print("Requires nothing: this line ends the chain.")
              print()
              print(f"Inputs: `{meta['inputs_sha256']}`")
              print()
          print("### Assets")
          print()
          print("| file | sha256 | bytes |")
          print("|---|---|---|")
          for asset in assets:
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              print(f"| `{asset.name}` | `{digest}` | {asset.stat().st_size} |")
          print()
          print(
              "These are the bytes the release gate built the reference firmware with. "
              "Publishing them to packages.mcuhome.org is a separate, deliberate act by "
              "the registry operator; see `RELEASING.md`."
          )
          PY
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release and attach them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate-release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already has a release. A version is published once and never replaced — cut the next number." >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
          # shellcheck disable=SC2046 # one asset per line, and none has a space in its name
          gh release upload "$TAG" $(cat assets.txt)
          gh release view "$TAG" --json assets --jq '.assets[].name'

  # ------------------------------------------------------------------
  # The build environment as a container image, per architecture.
  #
  # An image is an ASSEMBLY of one build workspace package and the newest
  # published build tools that package's own meta file accepts — never of
  # "the tag's version" for both, because the two lines do not share a
  # cadence. So the workspace archive decides, and it arrives one of two
  # ways: fresh out of this run for a workspace release, or off its GitHub
  # release for a revision dispatch. Nothing is fetched from the package
  # registry: it is fed by hand after a release, and an image that pinned
  # bytes it had not served would be an image nobody could match.
  #
  # Each architecture on a runner of that architecture, pushed under
  # `<version>-r<n>-<arch>`; the index over the two follows below under the
  # plain `<version>-r<n>`, which is what a client resolves.
  #
  # An existing tag is a REFUSAL, not something to overwrite or skip: the
  # tag is the content identity and `-r<n>` is the counter that exists for a
  # second assembly of one package set. A half-published set is repeated
  # under the next revision.
  build-environment-image:
    name: Build (build-environment image, ${{ matrix.arch }})
    needs: [gate-release, publish-release]
    if: >-
      always()
      && needs.gate-release.result == 'success'
      && (needs.gate-release.outputs.mode == 'image'
          || (needs.gate-release.outputs.stage == 'workspace'
              && needs.publish-release.result == 'success'))
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both architectures are reported even when one fails: "arm64 broke"
      # and "the image broke" are different news.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux-amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux-arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      # The package inherits the repository's visibility, which is public.
      packages: write
    outputs:
      # Both legs compute this from the same inputs with the same code, so
      # the matrix's "last job wins" rule has nothing to decide between.
      reference: ${{ steps.reference.outputs.reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The runner is the architecture the matrix claims
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) actual=linux-amd64 ;;
            aarch64) actual=linux-arm64 ;;
            *) actual="$(uname -m)" ;;
          esac
          test "$actual" = "$PLATFORM" || {
            echo "::error::this runner is $actual, not $PLATFORM" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The assembler opens both archives to read each package's own
      # manifest and the declaration the labels mirror; the resolver below
      # reads one meta file. Both only ever decompress, so the pin buys
      # consistency rather than reproducible bytes — but one release should
      # run on one library.
      - name: Install the pinned compressor
        run: python -m pip install --disable-pip-version-check "zstandard==${ZSTANDARD_VERSION}" packaging

      # The two package archives, the layers the unpack stage writes and the
      # finished image are on this disk at the same time.
      - name: Make room, and say how much there is
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Take the workspace package this run built
        if: needs.gate-release.outputs.mode != 'image'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages-workspace
          path: packages/workspace

      # A revision assembles a workspace release that already exists — a
      # refreshed base, a changed Dockerfile, or tools that were published
      # after it. Off the release page, like every other published byte
      # this workflow reads.
      - name: Take the published workspace release this revision is about
        if: needs.gate-release.outputs.mode == 'image'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE_VERSION: ${{ needs.gate-release.outputs.workspace_version }}
        run: |
          set -euo pipefail
          mkdir -p packages/workspace
          gh release download "workspace-v${WORKSPACE_VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern 'mcuhome-build-workspace-*.tar.zst' \
            --pattern 'mcuhome-build-workspace-*.tar.zst.sha256' \
            --pattern 'mcuhome-build-workspace-*.tar.zst.meta.json' \
            --dir packages/workspace --clobber
          (cd packages/workspace && sha256sum -c ./*.sha256)

      # WHICH tools this image delivers is the workspace package's to say,
      # and it said it in its own meta file: a PEP 440 constraint, resolved
      # by the gate to the newest published version satisfying it — the
      # same document, and the same answer, a workbench provisioning that
      # package gets.
      - name: Take the tools release this workspace accepts
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_TAG: ${{ needs.gate-release.outputs.tools_tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test -n "$TOOLS_TAG" || {
            echo "::error::the gate resolved no build tools release for this workspace package, so there is nothing to assemble an image from" >&2
            exit 1
          }
          mkdir -p packages/tools
          gh release download "$TOOLS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "mcuhome-build-tools_${PLATFORM}-*.tar.zst" \
            --pattern "mcuhome-build-tools_${PLATFORM}-*.tar.zst.sha256" \
            --dir packages/tools --clobber
          (cd packages/tools && sha256sum -c ./*.sha256)

      # The tag the naming scheme asks for, spelled out in one place: the
      # repository comes from the assembler, so the image's name lives in
      # one file, and the version half comes from the package rather than
      # from an input — the assembler derives it from the workspace
      # package's own manifest and the check below holds the two together.
      - name: Resolve the image reference
        id: reference
        env:
          REVISION: ${{ needs.gate-release.outputs.mode == 'image' && needs.gate-release.outputs.revision || '1' }}
        run: |
          set -euo pipefail
          set -- packages/workspace/*.tar.zst
          python3 - "$1" >> "$GITHUB_OUTPUT" <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from build_env_image import image_reference

          revision = int(os.environ["REVISION"])
          print(f"revision={revision}")
          print(f"reference={image_reference(Path(sys.argv[1]), revision)}")
          PY

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag IS the content identity, so a tag that already exists is not
      # something to overwrite: `-r<n>` is the counter that exists for a
      # second assembly of one package set. Asked with `docker manifest
      # inspect` rather than a pull — the answer is a name, and pulling
      # gigabytes to learn that a name is taken is gigabytes spent on
      # nothing.
      - name: This tag must not exist yet
        env:
          REFERENCE: ${{ steps.reference.outputs.reference }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for candidate in "$REFERENCE" "${REFERENCE}-${ARCH}"; do
            if docker manifest inspect "$candidate" >/dev/null 2>&1; then
              echo "::error::$candidate is already published. A tag names one set of bytes and is never moved — dispatch the next revision instead (workspace_version + revision)." >&2
              exit 1
            fi
          done

      # Through the assembler, never a bare `docker build`: the
      # specification asks the image to repeat every member of its packages'
      # declaration as an OCI label, a `LABEL` cannot read a file, and an
      # image without those labels is one no orchestrator would ever select.
      # The script also refuses when the two archives are not the set the
      # declaration names, and reads the built image back to check that it
      # mirrors it.
      - name: Assemble the image
        env:
          REFERENCE: ${{ steps.reference.outputs.reference }}
          REVISION: ${{ steps.reference.outputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          set -- packages/workspace/*.tar.zst
          workspace="$1"
          set -- packages/tools/*.tar.zst
          python scripts/build_env_image.py \
            --workspace "$workspace" --tools "$1" --revision "$REVISION"
          docker image inspect "$REFERENCE" >/dev/null
          docker tag "$REFERENCE" "${REFERENCE}-${ARCH}"
          df -h /

      - name: The image is the architecture its tag claims
        env:
          REFERENCE: ${{ steps.reference.outputs.reference }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          built="$(docker image inspect "${REFERENCE}-${ARCH}" --format '{{.Architecture}}')"
          test "$built" = "$ARCH" || {
            echo "::error::${REFERENCE}-${ARCH} is $built, not $ARCH" >&2
            exit 1
          }

      # Only the per-architecture tag. The plain `<version>-r<n>` is the
      # index, and the index is the job below — pushing the local image
      # under it here would publish one architecture under the name every
      # client resolves.
      - name: Publish this architecture
        env:
          REFERENCE: ${{ steps.reference.outputs.reference }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker push "${REFERENCE}-${ARCH}"
          echo "::notice::published ${REFERENCE}-${ARCH}"

  # The index over the two, under the name clients actually use. Split from
  # the job above because it needs BOTH architectures to exist, which is
  # what `needs` says and a matrix cannot — and skipped with them when one
  # leg failed, so a half-published set never gets an index over it.
  publish-environment-image-index:
    name: Publish (build-environment image index)
    needs: build-environment-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The digest is the identity; the tag is where it was found. What
      # verify-release builds against is this.
      digest: ${{ steps.index.outputs.digest }}
      reference: ${{ needs.build-environment-image.outputs.reference }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker manifest rm` first, ignoring its failure: the local manifest
      # list is state on the runner and `create` refuses to overwrite one.
      # Nothing in the registry is touched by it.
      - name: Compose and push the index
        id: index
        env:
          REFERENCE: ${{ needs.build-environment-image.outputs.reference }}
        run: |
          set -euo pipefail
          test -n "$REFERENCE" || {
            echo "::error::the architecture jobs published no image reference" >&2
            exit 1
          }
          docker manifest rm "$REFERENCE" >/dev/null 2>&1 || true
          docker manifest create "$REFERENCE" \
            "${REFERENCE}-amd64" \
            "${REFERENCE}-arm64"
          digest="$(docker manifest push "$REFERENCE" | tail -n1)"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::docker manifest push printed no digest: '$digest'" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::published $REFERENCE at $digest"

      # What a client will actually do with it, done here once: resolve the
      # tag to a digest and check that the digest names an index over the
      # two architectures. A tag that resolved to a single manifest would be
      # an environment half this project's users cannot run, published under
      # a name that says otherwise.
      - name: The tag names an index over both architectures
        env:
          REFERENCE: ${{ needs.build-environment-image.outputs.reference }}
        run: |
          set -euo pipefail
          docker manifest inspect "$REFERENCE" > index.json
          python3 - <<'PY'
          import json
          import sys

          index = json.load(open("index.json"))
          if "manifests" not in index:
              sys.exit(f"the tag resolves to a single manifest: {index.get('mediaType')}")
          found = sorted(
              entry["platform"]["architecture"]
              for entry in index["manifests"]
              if entry.get("platform", {}).get("architecture") not in (None, "unknown")
          )
          print("architectures:", found)
          if found != ["amd64", "arm64"]:
              sys.exit(f"expected amd64 and arm64, the index names {found}")
          PY

  # ------------------------------------------------------------------
  # The last question: does the CONTAINER profile deliver the same thing?
  #
  # The gate above built the reference device in the subprocess profile out
  # of the packages. This job builds it again in the image — by DIGEST, so
  # what is verified and what was pushed are one set of bytes — with the
  # release's packages as local sources, on both architectures.
  #
  # Which image depends on the line:
  #
  #   workspace tag, image revision   the image this run just pushed.
  #   SDK tag                         the published image of the build
  #                                   workspace this release resolves to.
  #                                   The workbench matches an image by its
  #                                   `packages.` labels, so an image that
  #                                   does not deliver exactly the resolved
  #                                   set is refused there rather than here;
  #                                   where no image exists for that
  #                                   workspace at all, this job says so and
  #                                   verifies nothing.
  #   tools tag                       nothing to verify against: an image
  #                                   delivers a workspace package and the
  #                                   tools it accepts, and no published
  #                                   image can declare tools that did not
  #                                   exist when it was assembled. The
  #                                   revision dispatch takes them into an
  #                                   image, and verifies there.
  #
  # Skipping is stated, never silent: a release that verified nothing has to
  # say which of those three it was.
  verify-release:
    name: Verify (release, ${{ matrix.target.arch }})
    needs: [gate-release, build-packages, publish-release, publish-environment-image-index]
    if: >-
      always()
      && needs.gate-release.result == 'success'
      && needs.gate-release.outputs.mode != 'rehearse'
      && (needs.publish-release.result == 'success'
          || needs.gate-release.outputs.mode == 'image')
      && (needs.publish-environment-image-index.result == 'success'
          || needs.gate-release.outputs.verify_mode != 'pushed-image')
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        combination: ${{ fromJSON(needs.gate-release.outputs.verify_combinations || '[{"id":"image-revision"}]') }}
        target:
          - arch: amd64
            platform: linux-amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux-arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    env:
      PLATFORM: ${{ matrix.target.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcuhome-sdk

      - name: Log in to ghcr.io
        if: needs.gate-release.outputs.verify_mode != 'skip'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Which image, and whether there is one. The pushed one is named by
      # its digest; a published one is looked for under the revisions of the
      # workspace version this release resolves to, highest first — "newest
      # unless pinned", the rule the workbench itself follows.
      - name: Which image is this verified against
        id: image
        env:
          MODE: ${{ needs.gate-release.outputs.verify_mode }}
          REASON: ${{ needs.gate-release.outputs.verify_reason }}
          PUSHED: ${{ needs.publish-environment-image-index.outputs.reference }}
          DIGEST: ${{ needs.publish-environment-image-index.outputs.digest }}
          WANTED: ${{ needs.gate-release.outputs.verify_workspace_version }}
        run: |
          set -euo pipefail
          repository=ghcr.io/mcu-home/build-environment
          case "$MODE" in
            skip)
              echo "::notice::not verified against an image: $REASON"
              {
                echo "## Not verified against an image"
                echo
                echo "$REASON"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "verify=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            pushed-image)
              test -n "$DIGEST" || {
                echo "::error::no image digest reached this job" >&2
                exit 1
              }
              echo "::notice::verifying against $PUSHED at $DIGEST"
              echo "image=${repository}@${DIGEST}" >> "$GITHUB_OUTPUT"
              echo "verify=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # A published image for the workspace this release resolves to.
          # The highest revision wins; ten is far more than any package set
          # has ever been assembled, and probing a name costs one API call.
          found=""
          for revision in $(seq 10 -1 1); do
            candidate="${repository}:${WANTED}-r${revision}"
            if docker manifest inspect "$candidate" >/dev/null 2>&1; then
              found="$candidate"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::notice::no build-environment image delivers mcuhome-build-workspace $WANTED yet, so there is nothing to verify this release in. Assemble one with the revision dispatch (workspace_version=$WANTED, revision=1)."
            {
              echo "## Not verified against an image"
              echo
              echo "No build-environment image delivers mcuhome-build-workspace $WANTED yet."
              echo "Assemble one with the revision dispatch (workspace_version=$WANTED,"
              echo "revision=1) and it will be verified there."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "verify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::verifying against $found"
          echo "image=$found" >> "$GITHUB_OUTPUT"
          echo "verify=true" >> "$GITHUB_OUTPUT"

      - name: Checkout the mcuhome command line
        if: steps.image.outputs.verify == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-cli
          path: .deps/mcuhome-cli

      - name: Checkout the workbench
        if: steps.image.outputs.verify == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-workbench
          path: .deps/mcuhome-workbench

      - name: Checkout the package tool
        if: steps.image.outputs.verify == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-packagetool
          ref: 7ce85fce47b89532dfa1585f0790e0820a1fbc71 # the ref mcuhome-workbench's ci-test.yml pins
          path: .deps/mcuhome-packagetool

      - name: Set up Python
        if: steps.image.outputs.verify == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the builder and its command line
        if: steps.image.outputs.verify == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            -e ./mcuhome-sdk/packaging/model \
            -e ./.deps/mcuhome-packagetool \
            -e ./.deps/mcuhome-workbench \
            -e ./mcuhome-sdk/packaging/compiler \
            -e ./.deps/mcuhome-cli
          python -m pip install --disable-pip-version-check imgtool==2.4.0

      - name: Make room on the runner
        if: steps.image.outputs.verify == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # The same three source directories the gate built with. The context
      # still resolves the package set here — that is what decides which
      # image may deliver it — and the SDK archive is delivered from a
      # source in every profile.
      - name: Take the packages this run built
        if: steps.image.outputs.verify == 'true' && needs.gate-release.outputs.mode != 'image'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: packages-*
          path: artifacts

      - name: Assemble the package sources
        if: steps.image.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.gate-release.outputs.mode }}
          WORKSPACE_VERSION: ${{ needs.gate-release.outputs.workspace_version }}
          IMAGE_SDK_TAG: ${{ needs.gate-release.outputs.sdk_tag }}
          IMAGE_TOOLS_TAG: ${{ needs.gate-release.outputs.tools_tag }}
          SDK_SOURCE: ${{ matrix.combination.sdk.source }}
          SDK_TAG: ${{ matrix.combination.sdk.tag }}
          WORKSPACE_SOURCE: ${{ matrix.combination.workspace.source }}
          WORKSPACE_TAG: ${{ matrix.combination.workspace.tag }}
          TOOLS_SOURCE: ${{ matrix.combination.tools.source }}
          TOOLS_TAG: ${{ matrix.combination.tools.tag }}
        run: |
          set -euo pipefail
          mkdir -p sources/sdk sources/workspace sources/tools
          published() {
            tag="$1"; into="$2"; pattern="$3"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$pattern" --pattern "$pattern.sha256" \
              --pattern "$pattern.meta.json" --dir "$into" --clobber
            python mcuhome-sdk/scripts/release_readiness.py sources "$into"
          }
          if [ "$MODE" = image ]; then
            # A revision verifies the image it just assembled, against the
            # only published chain that reaches it — the workspace release
            # itself, the tools it accepts and the newest SDK that accepts
            # it, all three resolved by the gate.
            published "workspace-v${WORKSPACE_VERSION}" sources/workspace \
              'mcuhome-build-workspace-*.tar.zst'
            published "$IMAGE_SDK_TAG" sources/sdk 'mcuhome-sdk-*.tar.zst'
            published "$IMAGE_TOOLS_TAG" sources/tools \
              "mcuhome-build-tools_${PLATFORM}-*.tar.zst"
          else
            take() {
              stage="$1"; source="$2"; tag="$3"; pattern="$4"; artifact="$5"
              if [ "$source" = published ]; then
                published "$tag" "sources/$stage" "$pattern"
              else
                cp -a "artifacts/$artifact/." "sources/$stage/"
              fi
            }
            take sdk "$SDK_SOURCE" "$SDK_TAG" 'mcuhome-sdk-*.tar.zst' packages-sdk
            take workspace "$WORKSPACE_SOURCE" "$WORKSPACE_TAG" \
              'mcuhome-build-workspace-*.tar.zst' packages-workspace
            take tools "$TOOLS_SOURCE" "$TOOLS_TAG" \
              "mcuhome-build-tools_${PLATFORM}-*.tar.zst" "packages-tools-${PLATFORM}"
          fi
          for one in sources/*/index.json; do
            echo "--- $one"
            cat "$one"
          done

      # The same throwaway signing key as the gate's builds, for the same
      # reason: what the two profiles produce is then comparable byte for
      # byte, bootloader included.
      - name: Make a project for it
        if: steps.image.outputs.verify == 'true'
        run: |
          set -euo pipefail
          mkdir -p project
          cd project
          mcuhome project init
          mkdir -p devices
          cp ../mcuhome-sdk/docs/design/examples/00-bmp180-two-endpoints.yaml devices/
          install -d -m 700 "$RUNNER_TEMP/signing"
          install -m 600 ../mcuhome-sdk/.github/workflows/firmware-signing-key.pem \
            "$RUNNER_TEMP/signing/mcuboot.pem"

      # The container profile, against exactly this image. The workbench
      # holds the image's `packages.` labels against the package set the
      # context resolved and refuses to build in one that does not declare
      # it — which is what makes this a verification of the image and not
      # just another build.
      - name: Build the reference Matter device in the image
        if: steps.image.outputs.verify == 'true'
        working-directory: project
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          mcuhome device build devices/00-bmp180-two-endpoints.yaml \
            --build-dir build/bmp180-node \
            --signing-key "$RUNNER_TEMP/signing/mcuboot.pem" \
            --build-target local --build-mode container \
            --container-image "$IMAGE" \
            --sdk-sources "$GITHUB_WORKSPACE/sources/sdk" \
            --sdk-sources "$GITHUB_WORKSPACE/sources/workspace" \
            --sdk-sources "$GITHUB_WORKSPACE/sources/tools"

      - name: Check the artifact set
        if: steps.image.outputs.verify == 'true'
        run: python3 mcuhome-sdk/scripts/check_build_artifacts.py project/build/bmp180-node

      - name: What it produced
        if: steps.image.outputs.verify == 'true'
        run: |
          set -euo pipefail
          cd project/build/bmp180-node
          sha256sum -- firmware.bin firmware.hex bootloader.hex build-report.json
