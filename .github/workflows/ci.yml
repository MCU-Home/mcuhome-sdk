# SPDX-FileCopyrightText: 2026 The MCUHome Contributors
# SPDX-License-Identifier: Apache-2.0
#
# CI for the MCUHome firmware framework. Four gates:
#
#   lint     — the same ruff/REUSE/debug-output checks
#              ruff runs. Needs nothing but
#              Python.
#   pytest   — the Python suite in tests/python/, the fast half of the test
#              strategy. Needs nothing but Python either, which is why
#              running it nowhere automated was never a cost worth
#              paying.
#   twister  — the Zephyr test suites in tests/, compiled and run inside
#              the MCUHome builder image (ADR 0007). The image is the same
#              one `mcuhome device build` uses, which is the point of having one:
#              "passes in CI" and "builds on my machine" mean the same
#              thing or the container strategy is not worth its weight.
#   matter   — one real Matter firmware, built end to end the way a user
#              builds one: patched west projects, the builder image, the
#              generator, `mcuhome device build`. The expensive gate, and the
#              only one that touches the Matter SDK at all; it runs only
#              when something that can break it changed. `matter-gate`
#              below decides that, and the head comment of `matter` says
#              why the job exists.
#
# And one job that is not a gate: `sdk-package` builds the
# `mcuhome-sdk-<version>` archive on `main` and uploads it as a workflow
# artifact. It publishes nothing and can fail nothing that a pull request
# would notice; see its own head comment.
#
# All actions are pinned to commit SHAs, not tags (see dependabot.yml,
# which keeps the pins current via its github-actions ecosystem entry).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs exist for the `matter` gate: it is path-triggered, and
  # "run it anyway" (after a builder-image publish, before a release, to
  # reproduce a bench failure) has to be possible without an empty
  # commit. lint and twister come along, which costs a minute.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.1

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .


      # Debug output is load-bearing: config fragments must
      # not reduce diagnostics without a recorded decision and its
      # `# debug-output: approved <reason>` marker.
      - name: Debug-output policy
        run: python scripts/check_debug_output.py

  # The Python suite in tests/python/ — the fast half of the test strategy
  # (docs/design/builder-pipeline.md §9), which until now ran nowhere
  # automated at all: three distributions' worth of invariants, the
  # golden generator output and every refusal message, none of them
  # gated by anything but a developer remembering to run pytest.
  #
  # Since the ADR 0024 split this repository carries the SDK half of
  # the suite: model, compiler, the golden generator output, the
  # container conformance tests. The workbench half runs in
  # mcu-home/mcuhome-workbench. `-rs` keeps any skip loud in the log rather than
  # a dot.
  test-pytest:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The two editable installs this repository publishes since the
      # ADR 0024 split (the workbench lives in mcu-home/mcuhome-workbench), and no
      # aggregate distribution over them (ADR 0020 decision 2 and the
      # head comment of the root pyproject.toml).
      # zstandard is named in its own right: scripts/build_sdk_archive.py
      # needs it and so does the test over it. It used to arrive through
      # mcuhome-compiler, which declared it for the orchestrator — and
      # the orchestrator is the workbench's now.
      - name: Install the two distributions
        run: |
          python -m pip install --disable-pip-version-check \
            -e ./packaging/model \
            -e ./packaging/compiler \
            'pytest>=8.0' zstandard

      - name: pytest
        run: pytest -q -rs

  test-twister:
    name: Test (twister)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull only. Publishing is the `image` job's business since r11:
      # a multi-architecture image is published as an index over two
      # per-architecture manifests, and neither of the jobs that *use* an
      # image is in a position to compose one.
      packages: read
    steps:
      # The checkout goes one level down: this repository is the west
      # manifest repository of a T2 workspace, and the workspace top
      # directory (GITHUB_WORKSPACE, here) must not be a git repository.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcuhome-sdk

      # One source of truth for the image name: mcuhome/model/buildimage.py
      # carries the Zephyr release and the image revision, this job tags
      # what it says, and a workbench resolves the very same string when a
      # developer runs `mcuhome device build`. Importing it needs no
      # third-party package — that module is a handful of constants, on
      # purpose.
      #
      # The moving tags (aliases) are how a build environment is found:
      # a client picks the Zephyr release it needs and the publisher says
      # which revision of it he currently recommends through the moving tags.
      - name: Resolve the builder image reference
        id: image
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          sys.path.insert(0, "mcuhome-sdk")
          from mcuhome.model.buildimage import (
              IMAGE,
              IMAGE_REPOSITORY,
              ZEPHYR_RELEASE,
              aggregate_tags,
              latest_tag,
          )
          print(f"reference={IMAGE}")
          moving = (latest_tag(ZEPHYR_RELEASE), *aggregate_tags(ZEPHYR_RELEASE))
          print("aliases=" + " ".join(f"{IMAGE_REPOSITORY}:{tag}" for tag in moving))
          PY

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "Has the image changed?" is answered by asking the registry, not by
      # diffing the Dockerfile: the tag *is* the content identity
      # (zephyr-<line>-r<revision>), so a tag that does not exist yet means
      # an image input changed and its revision was bumped — and a bump
      # that somebody forgot fails loudly here instead of quietly testing
      # against a stale environment. Since r3 the image inputs are
      # containers/build-container/ AND west.yml AND patches/, because the image
      # bakes a west workspace with the patch set applied.
      - name: Pull the builder image, or build it
        id: builder
        run: |
          reference='${{ steps.image.outputs.reference }}'
          if docker pull --quiet "$reference"; then
            echo "Using the published image."
          else
            echo "::notice::$reference is not published yet — building it."
            # The context is the repository, not containers/build-container/:
            # since r3 the image bakes a west workspace, so west.yml
            # and patches/ are image inputs too.
            docker build --tag "$reference" \
              --file mcuhome-sdk/containers/build-container/Dockerfile mcuhome-sdk
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      # Keyed on west.yml alone: that file is the complete description of
      # what `west update` produces. Zephyr and the modules are fetched
      # shallow and narrow, which is what keeps this cache small enough to
      # be worth having.
      #
      # The path list must cover EVERY directory west creates, because a
      # cache hit skips `west update` entirely: a project the cache did
      # not carry is then simply absent from the workspace. That is not
      # hypothetical — mcuboot lands in bootloader/, the original list
      # stopped at modules/, and the first warm-cache run after the
      # ota_staging suite appeared failed on a missing
      # bootutil/bootutil_public.h (flash_img includes it via
      # CONFIG_IMG_MANAGER). The `west-2` segment versions the path set:
      # bumping it retires caches saved with the old, incomplete list,
      # which a key based on west.yml alone would happily restore.
      - name: Restore the west workspace
        id: west-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .west
            zephyr
            modules
            bootloader
          key: west-2-${{ runner.os }}-${{ hashFiles('mcuhome-sdk/west.yml') }}

      # Without the Matter SDK: every suite in tests/ is CHIP-free by
      # design (ADR 0014, and the reason tests/twister/matter_tables/ tests the
      # table validator rather than the runtime). Skipping the `matter`
      # group keeps a multi-gigabyte clone with submodules out of CI.
      - name: Initialize the west workspace
        if: steps.west-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" --workdir "$PWD" \
            '${{ steps.image.outputs.reference }}' \
            sh -euc '
              west init -l mcuhome-sdk
              west config manifest.group-filter -- -matter
              west update --narrow -o=--depth=1
            '

      - name: Run the Zephyr test suites
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" --workdir "$PWD" \
            '${{ steps.image.outputs.reference }}' \
            west twister -T mcuhome-sdk/tests/twister --integration --inline-logs -v -j 2

  # ------------------------------------------------------------------
  # Publishing the build environment. Since r11 it is a MULTI-ARCHITECTURE
  # image: an OCI index over one manifest per architecture, built natively
  # on each rather than one of them emulated. A Home Assistant box is a
  # `rpi4-64`, so an amd64-only build environment is one no HA user can
  # ever run — that is what this job exists for.
  #
  # Three steps and they cannot be fewer:
  #
  #   1. each architecture is built on its own runner and pushed under its
  #      own tag, `<revision-tag>-<arch>`. That tag is an ordinary content
  #      identity — exactly these bytes for exactly this architecture — and
  #      it is what somebody pulls who wants one architecture on purpose.
  #   2. the index is composed from those two and pushed under the plain
  #      revision tag, which is what every client resolves and pins.
  #   3. the moving tags (`zephyr-<X.Y.Z>-latest` and the aggregates) are
  #      the same index under the names a client searches by.
  #
  # `docker manifest` rather than buildx: it is the tool this workflow
  # already has, needs no builder setup step, and composes an index from
  # references that are already in the registry — which these are, by
  # step 1. The two per-architecture tags are the price and they are worth
  # paying: they name real bytes and nothing else in the registry does.
  #
  # Push events only. A pull request that changes the image builds its own
  # copy in the jobs that use one (twister, matter) and publishes nothing
  # — the same rule as before r11, and the reason a fork cannot publish.
  build-image:
    name: Build (build environment)
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both architectures are reported even when one fails: "arm64 broke"
      # and "the image broke" are different news and the second one is
      # what a cancelled sibling would tell.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Free for public repositories and generally available since
            # 2025-08-07; 4 vCPU / 16 GB / 14 GB SSD, the same machine the
            # x64 standard runner is. Native, so nothing here is emulated
            # — a QEMU build of this image would be hours.
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      # The package inherits the repository's visibility, which is public.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcuhome-sdk

      - name: Resolve the builder image reference
        id: image
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import sys

          sys.path.insert(0, "mcuhome-sdk")
          from mcuhome.model.buildimage import IMAGE

          print(f"reference={IMAGE}")
          PY

      # The image is 5.28 GB on disk and building it wants several times
      # that in layers and cache. The amd64 runner has been measured at
      # 72 GB total and 34 GB free after this step; what an arm64 runner
      # has is not something this project has measured yet — the
      # documentation quotes the same 14 GB SSD for both, which is a
      # floor rather than the number. So: free what nothing here uses,
      # and print the result, which is how the first run tells us.
      # `rm -rf` on an absent path is not an error, so the same list
      # serves both runner images.
      - name: Make room, and say how much there is
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same freshness rule as everywhere else in this workflow: the tag
      # IS the content identity, so a tag that does not exist yet means an
      # image input changed and its revision was bumped. Per architecture,
      # because that is what this tag names.
      - name: Build and publish this architecture
        run: |
          arch_reference='${{ steps.image.outputs.reference }}-${{ matrix.arch }}'
          if docker pull --quiet "$arch_reference"; then
            echo "::notice::$arch_reference is already published."
            exit 0
          fi
          echo "::notice::building $arch_reference"
          # The context is the repository, not containers/build-container/:
          # since r3 the image bakes a west workspace, so west.yml and
          # patches/ are image inputs too.
          docker build --tag "$arch_reference" \
            --file mcuhome-sdk/containers/build-container/Dockerfile mcuhome-sdk
          docker push "$arch_reference"

      # The architecture this runner really is, asserted rather than
      # assumed: a matrix entry is a label and a label is a promise
      # somebody else keeps. An image built on the wrong runner would be
      # published under a name that lies, and the index would then serve
      # amd64 bytes to an arm64 host.
      - name: The image is the architecture its tag claims
        run: |
          arch_reference='${{ steps.image.outputs.reference }}-${{ matrix.arch }}'
          built="$(docker image inspect "$arch_reference" --format '{{.Architecture}}')"
          test "$built" = '${{ matrix.arch }}' || {
            echo "$arch_reference is $built, not ${{ matrix.arch }}" >&2
            exit 1
          }

  # The index over the two, under the names clients actually use. Split
  # from the job above because it needs BOTH architectures to exist, which
  # is what `needs` says and a matrix cannot.
  publish-image-index:
    name: Publish (image index)
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcuhome-sdk

      - name: Resolve the builder image reference
        id: image
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import sys

          sys.path.insert(0, "mcuhome-sdk")
          from mcuhome.model.buildimage import (
              IMAGE,
              IMAGE_REPOSITORY,
              ZEPHYR_RELEASE,
              aggregate_tags,
              latest_tag,
          )

          print(f"reference={IMAGE}")
          moving = (latest_tag(ZEPHYR_RELEASE), *aggregate_tags(ZEPHYR_RELEASE))
          print("aliases=" + " ".join(f"{IMAGE_REPOSITORY}:{tag}" for tag in moving))
          PY

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker manifest rm` first, ignoring its failure: the local
      # manifest list is state on the runner, a re-run of this job finds
      # its own leftover, and `create` refuses to overwrite one. Nothing
      # in the registry is touched by it.
      - name: Compose and push the index
        run: |
          reference='${{ steps.image.outputs.reference }}'
          aliases='${{ steps.image.outputs.aliases }}'
          for target in "$reference" $aliases; do
            docker manifest rm "$target" >/dev/null 2>&1 || true
            docker manifest create "$target" \
              "${reference}-amd64" \
              "${reference}-arm64"
            docker manifest push "$target"
            echo "::notice::published $target"
          done

      # What a client will actually do with it, done here once: resolve
      # the tag to a digest and check that the digest names an index over
      # the two architectures. A tag that resolved to one manifest would
      # be an image half this project's users cannot run, published under
      # a name that says otherwise.
      - name: The tag names an index over both architectures
        run: |
          reference='${{ steps.image.outputs.reference }}'
          docker manifest inspect "$reference" > index.json
          python3 - <<'PY'
          import json
          import sys

          index = json.load(open("index.json"))
          if "manifests" not in index:
              sys.exit(f"the tag resolves to a single manifest: {index.get('mediaType')}")
          found = sorted(
              entry["platform"]["architecture"]
              for entry in index["manifests"]
              if entry.get("platform", {}).get("architecture") not in (None, "unknown")
          )
          print("architectures:", found)
          if found != ["amd64", "arm64"]:
              sys.exit(f"expected amd64 and arm64, the index names {found}")
          PY

  # ------------------------------------------------------------------
  # The trigger for the `matter` job below.
  #
  # A Matter build is a quarter of an hour of runner time (13:38 cold on
  # four cores, REMOTE-BUILD.md), so it must not run on every pull
  # request — but GitHub has no per-job path filter, and the workflow's
  # own `on:` block is shared with lint and twister, which DO run on
  # everything. Hence this gate: ten seconds of plain git, no third-party
  # action, deciding from the diff whether anything that can break a
  # Matter build was touched.
  #
  # The path list is the firmware and the builder, named explicitly:
  #
  #   west.yml                  the pinned Zephyr/CHIP revisions the
  #                             patches are generated against
  #   patches/                  the patch set itself
  #   compat/                   headers on CHIP's include path that are
  #                             not in any patch (compat/README.md)
  #   containers/build-container/       the build environment, contents included
  #   components/, app/, lib/, include/, drivers/, dts/, boards/,
  #   snippets/, CMakeLists.txt, Kconfig, zephyr/
  #                             everything that gets compiled into the
  #                             image or decides how
  #   mcuhome/                  the generator and the build orchestration
  #   scripts/                  pyshim (CHIP codegen imports it) and this
  #                             job's artifact check
  #   the reference example     what the job builds
  #   this workflow             so a change to the job runs the job
  #
  # Deliberately NOT in the list: docs/ other than that one example,
  # tests/, tests/python/, samples/ and the community files. A change there
  # cannot alter the firmware this job produces — samples/matter-node is
  # generator OUTPUT (ADR 0014), compared byte for byte by the pytest
  # suite, so a real change to it arrives together with a change under
  # mcuhome/ that is in the list.
  #
  # Fail-open: if the base commit cannot be resolved (a force push, a new
  # branch, a shallow history), the job runs. A missed regression is more
  # expensive than a wasted quarter of an hour.
  gate-matter:
    name: Gate (does this touch Matter?)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # No sub-directory here: this job builds nothing, so it needs no
      # west workspace and no topdir rule. Full history, because the diff
      # reaches back to the base of the pull request or the push.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          paths='
            .github/workflows/ci.yml
            CMakeLists.txt
            Kconfig
            west.yml
            app
            boards
            compat
            components
            containers/build-container
            docs/design/examples/00-bmp180-two-endpoints.yaml
            drivers
            dts
            include
            lib
            mcuhome
            patches
            scripts
            snippets
            zephyr
          '
          case '${{ github.event_name }}' in
            workflow_dispatch) base='' ;;
            pull_request)      base='${{ github.event.pull_request.base.sha }}' ;;
            *)                 base='${{ github.event.before }}' ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice::No base commit to compare against — running the Matter build."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$base" HEAD -- $paths; then
            echo "Nothing on the Matter build path changed since $base."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed on the Matter build path since $base:"
            git diff --name-only "$base" HEAD -- $paths
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # WHY THIS JOB EXISTS. On 2026-08-08 three build inputs turned out to
  # be missing, all three found by hand, none of them by CI:
  #
  #   1. the mbedTLS shim headers the CHIP patch puts on the include path
  #      lived in an untracked directory outside every repository (they
  #      are compat/mbedtls/ now);
  #   2. build_overrides/pigweed_environment.gni was a hand-written stub
  #      sitting in CHIP's own .gitignore and in no patch — every fresh
  #      workspace was one file short (it is a new-file hunk now);
  #   3. `cryptography` was absent from the builder image although
  #      sysbuild runs `imgtool getpub` on EVERY build, signing or not,
  #      and imgtool imports it at module load (image revision r2).
  #
  # Three independent blind spots hid the same gap: the twister job
  # filters the `matter` west group out, the suites in tests/ are
  # CHIP-free by design (ADR 0014), and every Matter build anyone ran
  # locally used the host method, where the host interpreter quietly supplied
  # what the image lacked. Nothing had ever walked the container path for
  # a Matter build. This job is that walk — patch set, compat headers,
  # image contents, west pins, generator and `mcuhome device build`, exercised
  # together on the example the node on the bench was commissioned from.
  # Delete it and those three classes of failure become invisible again.
  build-firmware:
    name: Build (Matter firmware)
    needs: gate-matter
    if: needs.matter-gate.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    # Both architectures, every time the gate opens (PO 2026-08-19). The
    # firmware is the same cross-compiled ARM binary either way — what
    # differs is the *host* the toolchain runs on, and that is exactly
    # what a build environment is. Noted as a later optimisation: once
    # there are timings, whichever architecture turns out slower is the
    # one that goes behind the gate, and it may well be amd64.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      # Pull only. Publishing the builder image is the twister job's
      # business (it runs on the same events and owns the tag).
      packages: read
    env:
      # Pins the host-side ccache directory into the workspace so the
      # cache action has a path it can name. Without it
      # the workbench's ccache lookup falls back to $XDG_CACHE_HOME/$HOME, which is
      # the runner's business and not stable across runner images.
      # `mcuhome device build` creates the two role directories under it
      # (cache-local, cache-shared) and mounts them where the image's own
      # ccache configuration expects them. Caching the root therefore
      # carries the written half; the read-only half stays empty here,
      # because nobody fills it on a runner.
      MCUHOME_CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      # Same topdir rule as the twister job: the workspace top directory
      # must not be a git repository, so this repo goes one level down.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcuhome-sdk

      # The `mcuhome` command is a thin shell in its own repository
      # (ADR 0017) and this job needs the command, not just the library.
      # While both repositories are private that means a read-only deploy
      # key, mirroring what mcu-home/mcuhome-cli already does in the other
      # direction. To rotate it (repository settings, no tooling):
      # Public sibling — plain checkout, no deploy key (the key retired
      # with the going-public flip). Once the packages are published this
      # becomes a plain pip install.
      - name: Checkout the mcuhome command line
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-cli
          path: .deps/mcuhome-cli

      # The workbench's home since the ADR 0024 split — this job drives
      # `mcuhome device build` end to end, and stages 1-3 live there.
      - name: Checkout the workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-workbench
          path: .deps/mcuhome-workbench

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Editable, and that is not a style preference: mcuhome.compiler.workspace's
      # installed_module_dir() resolves the module directory from the
      # package's own location and the container mounts it, so a copy in
      # site-packages would take the Python half of the SDK into the
      # build and leave the Zephyr module
      # — components/, compat/, scripts/pyshim/ — behind.
      #
      # Since the ADR 0024 split the model and the compiler come from
      # this repository, the workbench from its own (checked out above).
      # The order is the dependency order, which pip does not need but a
      # reader does. This job builds firmware, so it needs the compiler.
      - name: Install the builder and its command line
        run: |
          python -m pip install --disable-pip-version-check \
            -e ./mcuhome-sdk/packaging/model \
            -e ./.deps/mcuhome-workbench \
            -e ./mcuhome-sdk/packaging/compiler
          python -m pip install --disable-pip-version-check -e ./.deps/mcuhome-cli
          # The build container delivers an UNSIGNED image and the host
          # signs it afterwards (ADR 0015 decision 8) — so signing is a
          # host duty and imgtool a host tool. This job has no west
          # workspace to borrow bootloader/mcuboot/scripts/imgtool.py
          # from (the r7 image bakes its own), so it takes the pip
          # release, pinned to the version the mcuboot pin in west.yml
          # ships.
          python -m pip install --disable-pip-version-check imgtool==2.4.0

      # Measured on the 2026-08-09 run: 72 GB total, 34 GB free after this
      # step. That is comfortable for what the job wants at once — the
      # build container (the image bakes a west workspace, Matter
      # included), a restored compiler cache (up to the 5 GB
      # /etc/ccache.conf allows) and the build tree the container writes
      # back to the host. The host no longer clones connectedhomeip and
      # its four submodules, so the multi-gigabyte checkout that used to
      # sit beside the image is gone. The step stays because the
      # preinstalled Android/.NET/Haskell toolchains are worth tens of
      # gigabytes, nothing here uses them, and the headroom is what lets
      # the image grow without this job becoming the thing that discovers
      # it.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # Which machine is this, really. The two architectures build the
      # same firmware at measurably different speeds — 420 s against
      # 264 s cold, 88 s against 67 s warm — and the obvious explanation
      # is that "4 vCPU" means two physical cores plus their hyperthreads
      # on one side and four real cores on the other. GitHub does not
      # publish that, so it is asked here rather than assumed: `lscpu`
      # answers "Thread(s) per core" and the processor's own name, and
      # one line in a log settles a question that is otherwise a belief.
      - name: What machine is this
        run: |
          nproc --all
          lscpu | grep -Ei 'model name|^cpu\(s\)|thread|core|socket|mhz|bogomips' || lscpu
          free -h

      # Same resolution as the twister job, and for the same reason: the
      # builder decides what the image is called, nothing else does.
      - name: Resolve the builder image reference
        id: image
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          sys.path.insert(0, "mcuhome-sdk")
          from mcuhome.model.buildimage import IMAGE
          print(f"reference={IMAGE}")
          PY

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull-or-build, as in the twister job, minus the publish: the two
      # jobs run on the same event and would otherwise race for the tag.
      # This one builds its own copy when the tag is not published yet —
      # which is exactly the case a revision bump creates, and precisely
      # the case whose image contents this job is here to exercise.
      - name: Pull the builder image, or build it
        run: |
          reference='${{ steps.image.outputs.reference }}'
          if docker pull --quiet "$reference"; then
            echo "Using the published image."
          else
            echo "::notice::$reference is not published yet — building it."
            # The context is the repository, not containers/build-container/:
            # since r3 the image bakes a west workspace, so west.yml
            # and patches/ are image inputs too.
            docker build --tag "$reference" \
              --file mcuhome-sdk/containers/build-container/Dockerfile mcuhome-sdk
          fi

      # No west workspace is initialised and no patch is applied on the
      # host any more, and neither is a gap. The r7 image bakes a west
      # workspace with the `matter` group included and both files in
      # patches/ already applied (ADR 0020 decision E5), and the new
      # default backend builds inside the container against that baked
      # workspace. The host therefore never clones connectedhomeip and
      # its four submodules — the multi-gigabyte checkout this job used
      # to carry, and the reason for the make-room step, is gone with the
      # two steps that were here.
      #
      # The drift-detection story the removed `git apply` step told is
      # not lost, only moved earlier. A patch that no longer applies to
      # the revision west.yml pins fails the IMAGE build, and the
      # "Pull the builder image, or build it" step above builds r7 from
      # this repository whenever that tag is not yet published — which is
      # exactly the case a patch or a pin change creates (west.yml and
      # patches/ are image inputs since r3). So a drifted patch still
      # fails this job, at image build, before a single artifact exists.

      # Carrying the compiler cache is what makes this job affordable to
      # run twice in a row (13:38 cold against 2:02 warm on four cores,
      # REMOTE-BUILD.md). It works across runners only because the image
      # is configured for it: compiler_check = content survives a docker
      # pull where the default mtime check does not, and CCACHE_BASEDIR
      # normalizes the workspace path (containers/build-container/Dockerfile,
      # mcuhome/model/buildimage.py). Nothing had to be invented here.
      #
      # Restore always, save only from main: an entry may approach the
      # 5 GB the image allows, and a pull request saving one per run
      # would spend the repository's cache budget and evict the twister
      # job's west workspace.
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-matter-1-${{ runner.os }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-matter-1-${{ runner.os }}-${{ matrix.arch }}-

      # The default `mcuhome device build` resolves the device's SDK pin against
      # the source directories `--sdk-sources` names (build-container
      # contract v1's first tier) and mounts the selected package into
      # the container as the SDK tree, so this job has to produce one.
      # It is the same archive the sdk-package job publishes, built by the
      # same script into a directory next to the index.json that maps the
      # pin to it — seconds of work (a `git archive` and one zstd frame),
      # not the multi-gigabyte west clone the removed steps did. The
      # script reads the committed revision (HEAD), never the working
      # tree, and `--repo` defaults to the checkout the script lives in
      # (here mcuhome-sdk/). zstandard is unpinned on purpose: this archive is
      # a throwaway build input consumed in the same run, so its bytes
      # need not reproduce a release's the way the sdk-package job's must.
      - name: Build the SDK source archive
        run: |
          python -m pip install --disable-pip-version-check zstandard
          python mcuhome-sdk/scripts/build_sdk_archive.py --output-dir dist/sdk

      # The example the bench node was commissioned from — the YAML form
      # of samples/matter-node — built the documented way:
      # from the workspace top directory, in the builder image (the
      # default path, not the host method, which is the whole point), against
      # the SDK archive built above, with the RTT snippet the
      # debug-output directive requires. The signing key is generated on
      # first use and dies with the runner; nothing commissions this
      # image, and no key of any consequence exists on a CI runner. Job
      # count is left to the builder's own CPU/RAM detection
      # (mcuhome.compiler.workspace.auto_jobs).
      #
      # The default MCUHOME_BUILDER_IMAGE is now a bare repository that is
      # resolved against the registry. On a pull request, the image exists
      # only locally, so CI has to name the tag it built.
      - name: Build the reference Matter device
        env:
          MCUHOME_BUILDER_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          mcuhome device build mcuhome-sdk/docs/design/examples/00-bmp180-two-endpoints.yaml \
            --build-dir build/bmp180-node --sdk-sources dist/sdk

      # A green build that produced nothing is worse than a red one. The
      # build directory holds a build-report.json, and the checker
      # verifies that
      # the report is a well-formed §7.2.1 document, and that the unsigned
      # firmware, the host-signed firmware in both formats and the one
      # .ota image are present and non-empty. The container already
      # re-hashed every artifact on egress (contract §5.3), so this is a
      # presence-and-shape gate, not a second hash oracle.
      - name: Check the artifact set
        run: python3 mcuhome-sdk/scripts/check_build_artifacts.py build/bmp180-node

      # What this architecture produced, as hashes — the input to the
      # cross-architecture comparison below. Only the UNSIGNED artifacts:
      # a signature is not reproducible by construction (ECDSA draws a
      # random nonce per signature, tests/python asserts exactly that), so
      # comparing signed images would compare the randomness.
      # The unsigned firmware itself, not only its hash: "the two
      # architectures produced different bytes" is a fact, and "they
      # differ in one build id" and "they differ everywhere" are two
      # entirely different facts behind it. Only the comparison job can
      # tell those apart, and only if it has the bytes.
      #
      # Unsigned on purpose. A signature is not reproducible by
      # construction — ECDSA draws a random nonce per signature, which
      # tests/python asserts — so a signed image would differ between two
      # runs of the SAME architecture and drown the question.
      - name: Record what this architecture produced
        run: |
          mkdir -p produced
          cp build/bmp180-node/firmware.bin \
             build/bmp180-node/firmware.hex \
             build/bmp180-node/bootloader.hex produced/
          (cd produced && sha256sum *)

      - name: Upload what this architecture produced
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ matrix.arch }}
          path: produced/
          retention-days: 7

      - name: Save the compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-matter-1-${{ runner.os }}-${{ matrix.arch }}-${{ github.run_id }}

  # ------------------------------------------------------------------
  # Does the host architecture change the firmware? A report, not a gate
  # (PO 2026-08-19).
  #
  # The two `matter` legs cross-compile the same ARM firmware with the
  # same pinned toolchain, from the same sources, in the same build
  # environment — only the machine the compiler itself runs on differs.
  # Byte-identical output is therefore the *expected* answer and a
  # genuinely useful one: it says the environment, and not the host,
  # decides what a device gets.
  #
  # It is deliberately not a gate. A difference here has a long list of
  # innocent causes — a path baked into a build id, a timestamp a tool
  # embeds, a linker that orders a hash table by pointer — and turning a
  # red mark on those into "the arm64 build environment is broken" would
  # be the wrong lesson. What the report gives is the diff, named file by
  # file, for somebody to look at.
  compare-firmware:
    name: Compare (firmware across architectures)
    needs: build-firmware
    if: always() && needs.matter.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download what each architecture produced
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: firmware-*
          path: produced

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcuhome-sdk

      # Not a hash comparison: those two hashes already differ and say
      # nothing about why. This prints where and what — how many bytes,
      # in how many regions, at which offsets, and the neighbourhood as
      # text, which is how a compiler stamp or a path announces itself.
      - name: Compare them
        run: |
          python3 mcuhome-sdk/scripts/compare_firmware.py \
            produced/firmware-amd64 produced/firmware-arm64 \
            --label-left amd64 --label-right arm64 | tee comparison.txt
          {
            echo '## Does the host architecture change the firmware?'
            echo
            echo '```'
            cat comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-comparison
          path: comparison.txt
          retention-days: 7

  # ------------------------------------------------------------------
  # The SDK package (B2)
  # ------------------------------------------------------------------
  #
  # ADR 0019's amendment says "CI builds and hashes the
  # `mcuhome-sdk-<version>` archive"; this is that sentence. It is not a
  # gate — nothing about it can fail a pull request, because it runs on
  # `main` only — and it publishes nowhere. What it produces is a
  # workflow artifact: a file an operator can download into the local
  # source directory the build server searches first, which is "the whole
  # first implementation" of the package index that same amendment
  # describes.
  #
  # The pytest suite (tests/python/test_sdk_archive.py) is what proves the
  # bytes are deterministic and the allowlist holds; this job's value is
  # that the archive gets built from a clean checkout by something other
  # than a developer's machine, which is the same reason the `matter` job
  # exists.
  build-sdk-package:
    name: Build (SDK package)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Pinned, because the compressor decides the bytes. Identical zstd
      # parameters give identical output for one libzstd and not across
      # two, and the archive's SHA-256 is what a build context pins (ADR
      # 0018 §6) — so an unpinned compressor would quietly change the
      # identity of every build that used the package.
      - name: Install zstandard
        run: python -m pip install --disable-pip-version-check zstandard==0.25.0

      # HEAD, and therefore the commit — never the working tree. The
      # script reads the release version out of that same commit, so the
      # file name and the content cannot disagree.
      - name: Build the archive
        run: python scripts/build_sdk_archive.py --output-dir dist/sdk --revision HEAD

      - name: Show what was built
        run: |
          ls -l dist/sdk
          cat dist/sdk/index.json
          (cd dist/sdk && sha256sum -c ./*.sha256)

      # The archive, its sidecar and the index together: a downloaded
      # artifact is then already a source directory the build server can
      # be pointed at, rather than three things to reassemble.
      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcuhome-sdk-package
          path: dist/sdk
          if-no-files-found: error

  license-reuse:
    name: License (reuse)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check reuse==5.0.2

      - name: reuse lint
        run: reuse lint

  spell-codespell:
    name: Spelling (codespell)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check codespell==2.4.3

      # The ignored words are deliberate spellings, not slips: Requestor and
      # PASE are the Matter specification's own, OT is OpenThread, rsource is
      # Kconfig's. Generated documents and patches are skipped because their
      # wording is not ours to correct.
      - name: codespell
        run: codespell --ignore-words-list=requestor,pase,ot,rsource,re-declared,re-declare,re-used,unparseable,pre-empt --skip='./.git,./frontend/node_modules,*.matter,*.zap,pnpm-lock.yaml,*.patch'

  hygiene-prehooks:
    name: Hygiene (pre-commit-hooks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check pre-commit-hooks==5.0.0

      # The fixers rewrite and exit non-zero when they had to; in CI the tree
      # is throwaway, so that is exactly a check. `patches/` is excluded on
      # purpose: a context line in a unified diff is a single space, and
      # stripping it produces a patch that no longer applies.
      - name: Whitespace, final newline and line endings
        run: |
          text=$(git grep -Il '' -- . ':!patches/**' ':!*.patch' ':!*.matter' ':!*.zap')
          trailing-whitespace-fixer $text
          end-of-file-fixer $text
          mixed-line-ending --fix=no $text

      - name: No merge markers
        run: check-merge-conflict $(git grep -Il '' -- .)

      # --unsafe checks the syntax and not the tags: this project has its own
      # (`!secret`, `!file`), and a loader that refuses them is not a finding.
      - name: YAML parses
        run: |
          files=$(git ls-files '*.yml' '*.yaml')
          if [ -n "$files" ]; then check-yaml --unsafe $files; fi

  commits-conventional:
    name: Commits (conventional)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check conventional-pre-commit==4.0.0

      # Merge commits carry GitHub's wording, not ours, so they are skipped.
      - name: Every commit message states its kind
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          status=0
          for sha in $(git log --no-merges --format=%H "$range"); do
            git log -1 --format=%B "$sha" > /tmp/commit-message
            conventional-pre-commit /tmp/commit-message || { echo "  ^ $sha"; status=1; }
          done
          exit $status

  format-clang:
    name: Format (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Pinned, because the rules are in .clang-format but their reading
      # is the binary's: two versions disagree about the same file.
      - name: Install
        run: python -m pip install --disable-pip-version-check clang-format==22.1.8

      - name: clang-format
        run: clang-format --dry-run --Werror $(git ls-files '*.c' '*.h' '*.cpp' '*.hpp')
