#
# TOOL CONFIGURATION ONLY — this file is not a distribution.
#
# It used to build one, named `mcuhome`. ADR 0020 ended that twice over:
# decision 2 reserves the plain name for the command line, because `pip
# install mcuhome` should yield the command a user expects; and decision
# 1 split what one repository published into three distributions. Since
# the ADR 0024 repo split this repository publishes two of them —
# `packaging/{model,compiler}/pyproject.toml`; `mcuhome-workbench` is
# published from its own repository, github.com/mcu-home/mcuhome-workbench.
#
# What is deliberately NOT here is a fourth, aggregate distribution. It
# could not do the job it would exist for: a `[project]` table can depend
# on `mcuhome-model` from an index, never on the copy in this working
# tree, so `pip install -e '.[dev]'` would install three *published*
# distributions over the editable ones and quietly undo the setup it
# was asked for. The two paths are named explicitly instead — one pip
# invocation, and every word of it true ("Commands"):
#
#     pip install -e ./packaging/model -e ./packaging/compiler --group dev
#
# The tool sections below stay in one file because that is what they are:
# settings for the repository, not for any one distribution. Splitting
# them into ruff.toml + pytest.ini + .codespellrc would be three files
# replacing one, for nothing. The project files under `packaging/` carry
# no `[tool.ruff]` section, so ruff keeps resolving this one from there.

# PEP 735 dependency group, not a [project.optional-dependencies] extra:
# there is no [project] table in this file to hang an extra off in the
# first place (see above), and these tools are for working on this
# repository, never a runtime dependency of either distribution under
# packaging/ — a group installs standalone, without either of them.
# Pinned to the versions CI installs; bump here, CI follows. zstandard is
# unpinned, matching what ci-test.yml's test-pytest job installs today:
# scripts/build_sdk_archive.py needs it and so does the test that
# exercises the archive.
[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "zstandard",
  "ruff==0.16.5",
  "clang-format==23.1.0",
  "codespell==2.4.3",
  "reuse==6.2.0",
  "pre-commit-hooks==6.0.0",
]

# Where `scripts/release.py` finds this repository's release-relevant
# parts. The script itself is repository-agnostic — what differs between
# MCUHome's repositories is this block, so the same file serves all of
# them.
[tool.mcuhome-release]
version_files = ["mcuhome/model/__init__.py"]
changelog = "CHANGELOG.md"
tag_prefix = "v"
branch = "main"
gates = [
  "{python} -m ruff check .",
  "{python} -m ruff format --check .",
  "{python} -m pytest -q tests/python",
]
next_steps = [
  "git push && git push origin {tag}",
  "",
  "Then, once https://mirror-1.packages.mcuhome.org/sdk/index.json lists it:",
  "  gh workflow run release.yml -f tag={tag} -f image=true",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Design documents are prose; the Python sketches inside them illustrate
# an idea and are not source. `ruff format` reformats fenced code blocks
# in Markdown, which would silently rewrite approved design records.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Python tests live in tests/python/, not in tests/: tests/ holds Zephyr
# twister suites (testcase.yaml per directory) and twister recurses into
# whatever it is pointed at. Two runners, two roots, no overlap — see
# tests/python/README.md.
[tool.pytest.ini_options]
testpaths = ["tests/python"]

# Domain vocabulary codespell would "correct" into errors: OTA Requestor
# is the Matter specification's own cluster name, PASE/OT are protocol
# names, rsource is Kconfig syntax; the rest are the same deliberate
# spellings mcuhome-cli and mcuhome-workbench ignore.
#
# The generated .matter IDL is skipped: ZAP writes it from CHIP's own
# cluster XML, spelling mistakes included, and it is regenerated per
# release — so a fix here would be undone by the next regeneration and
# belongs upstream instead. The .zap it is generated from and the
# vendored upstream patches are skipped for the same reason. Moved here
# from the CI command line so scripts/lint.d/codespell can run the plain
# tool.
[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource,re-declared,re-declare,re-used,unparseable,pre-empt"
skip = "./.git,*.matter,*.zap,*.patch"
