#
# `mcuhome-compiler` — performing a build (ADR 0020 decision 1).
#
# See `packaging/model/pyproject.toml` for why the project directory and
# the code it ships are in different places.
#
# The base dependency is `mcuhome-model` and nothing above it
# (ADR 0024): the compiler ships inside the SDK package and runs in the
# build container, where the workbench neither exists nor belongs. The
# optionality of ADR 0020 decision 3 runs the other way — the
# workbench's `local` extra pulls this distribution in for the local
# build methods; nothing here imports the workbench (the compiler's own
# context reading is `mcuhome.compiler.contextread`).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuhome-compiler"
# Dynamic because the pin on the sibling distribution is exact and
# must not be a second copy of the release version. See the `setup.py`
# next to this file.
dynamic = ["version", "dependencies"]
description = "MCUHome's compiler: code generation, west orchestration, build report, invocation-ABI adapter."
readme = { text = """
Stages 4 and 5 of the MCUHome build: the per-device Zephyr application,
the west invocation that compiles it, the artifact set and the build
report — plus the adapter that turns a build container's invocation into
exactly that build.

This is what ships inside the MCUHome SDK package and runs in the build
container. An installation that only ever drives builds through a
container never installs it.

Part of the MCUHome firmware framework — https://github.com/mcu-home/mcuhome
""", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = ["zephyr", "matter", "thread", "home-assistant", "firmware"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/mcu-home/mcuhome"
Issues = "https://github.com/mcu-home/mcuhome/issues"
Changelog = "https://github.com/mcu-home/mcuhome/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["mcuhome.compiler"]

[tool.setuptools.package-dir]
"" = "../.."

[tool.setuptools.dynamic]
version = { attr = "mcuhome.model.__version__" }
